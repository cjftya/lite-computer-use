name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Full Windows unit and simulated input suite
        if: runner.os == 'Windows'
        run: python -m pytest -q tests
      - name: Portable logic and mocked Windows contracts
        if: runner.os == 'Linux'
        run: >-
          python -m pytest -q --junitxml=pytest-results.xml
          tests/test_v2_orchestration.py
          tests/test_v2_batch.py
          tests/test_input_batch_stabilization.py
          tests/test_v2_input_desktop.py
          tests/test_v2_launch_review_fixes.py
          tests/test_v2_app_launch_redesign.py
          tests/test_v2_launch_safety_remediation.py
          tests/test_v2_cli_safe_launch.py
      - name: Annotate Linux test failures
        if: failure() && runner.os == 'Linux'
        run: python scripts/annotate_pytest_failures.py pytest-results.xml
      - run: python -m compileall -q scripts tests
