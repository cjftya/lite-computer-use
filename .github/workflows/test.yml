name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --collect-only -q tests
      - name: Launch contracts and existing launch safety tests
        run: >-
          python -m pytest -q
          tests/test_v2_launch_review_fixes.py
          tests/test_v2_app_launch_redesign.py
          tests/test_v2_launch_safety_remediation.py
          tests/test_v2_cli_safe_launch.py
      - run: python -m compileall -q scripts tests
