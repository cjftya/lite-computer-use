<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>LCU Download Fixture</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 40px; background: #f8fafc; }
    .card { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; }
    .download-btn { display: inline-block; background: #059669; color: white; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; margin-top: 20px; }
  </style>
</head>
<body>
<div class="card">
  <h2>테스트 파일 다운로드</h2>
  <p>아래 버튼을 클릭하여 샘플 텍스트 파일을 다운로드하세요.</p>
  <a href="sample.txt" download="sample.txt" class="download-btn" id="btnDownload">샘플 텍스트 다운로드 (sample.txt)</a>
</div>
</body>
</html>
