apps:
  chrome:
    aliases: [chrome, google chrome, 크롬, 구글 크롬]
    commands:
      - target: chrome.exe
        args: ["--new-window", "about:blank"]
        priority: 0
      - chrome.exe
    process_cleanup:
      mode: rollback-on-failure
      process_names:
        - chrome.exe

  edge:
    aliases: [edge, microsoft edge, 엣지, 마이크로소프트 엣지]
    commands: [msedge.exe]

  firefox:
    aliases: [firefox, 파이어폭스]
    commands: [firefox.exe]

  notepad:
    aliases: [notepad, 메모장]
    commands:
      - "shell:AppsFolder\\Microsoft.WindowsNotepad_8wekyb3d8bbwe!App"
      - notepad.exe
    process_cleanup:
      mode: owned-after-close
      process_names:
        - Notepad.exe

  calculator:
    aliases: [calculator, calc, 계산기]
    commands:
      - "shell:AppsFolder\\Microsoft.WindowsCalculator_8wekyb3d8bbwe!App"
      - calc.exe

  explorer:
    aliases: [explorer, file explorer, 파일 탐색기, 탐색기]
    commands: [explorer.exe]

  word:
    aliases: [word, microsoft word, 워드, 마이크로소프트 워드]
    commands: [winword.exe]

  excel:
    aliases: [excel, microsoft excel, 엑셀, 마이크로소프트 엑셀]
    commands: [excel.exe]

  powerpoint:
    aliases: [powerpoint, microsoft powerpoint, 파워포인트]
    commands: [powerpnt.exe]

  outlook:
    aliases: [outlook, microsoft outlook, 아웃룩]
    commands: [outlook.exe, olk.exe]

  teams:
    aliases: [teams, microsoft teams, 팀즈, 마이크로소프트 팀즈]
    commands:
      - "shell:AppsFolder\\MSTeams_8wekyb3d8bbwe!MSTeams"
      - ms-teams.exe
      - "msteams:"

  vscode:
    aliases: [vscode, visual studio code, vs code, 비주얼 스튜디오 코드]
    commands:
      - target: code.exe
        args: ["--new-window"]
        priority: 0
      - code.exe
      - code.cmd
    process_cleanup:
      mode: rollback-on-failure
      process_names:
        - Code.exe

  paint:
    aliases: [paint, microsoft paint, 그림판]
    commands:
      - "shell:AppsFolder\\Microsoft.Paint_8wekyb3d8bbwe!App"
      - mspaint.exe

  snipping-tool:
    aliases: [snipping tool, 캡처 도구, 스니핑 툴]
    commands: [snippingtool.exe]

  powershell:
    aliases: [powershell, 파워쉘, 파워셸]
    commands: [powershell.exe]

  command-prompt:
    aliases: [command prompt, cmd, 명령 프롬프트]
    commands: [cmd.exe]

  settings:
    aliases: [settings, windows settings, 설정, 윈도우 설정]
    commands:
      - "ms-settings:"
      - "shell:AppsFolder\\windows.immersivecontrolpanel_cw5n1h2txyewy!microsoft.windows.immersivecontrolpanel"

  task-manager:
    aliases: [task manager, 작업 관리자]
    commands: [taskmgr.exe]

  adobe-reader:
    aliases: [adobe reader, acrobat reader, 어도비 리더, 아크로뱃 리더]
    commands: [AcroRd32.exe, Acrobat.exe]
